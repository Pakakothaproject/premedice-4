openapi: 3.0.3
info:
  title: Premedice API
  version: 0.1.0
  description: OpenAI-compatible medical reasoning API. Preview. Decision support, not a diagnosis.
servers:
  - url: https://api.premedice.com
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      summary: List available models
      operationId: listModels
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/chat/completions:
    post:
      summary: Create a cited medical reasoning response
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/labs/interpret:
    post:
      summary: Interpret a structured lab panel
      operationId: interpretLabs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabRequest'
      responses:
        '200':
          description: Lab interpretation with sources and safety flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/evidence/verify:
    post:
      summary: Verify a claim against supplied sources
      operationId: verifyEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /mcp:
    post:
      summary: MCP JSON-RPC endpoint
      operationId: mcp
      description: Model Context Protocol endpoint for compatible AI clients. Uses the same bearer key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pm_live key
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: integer
            request_id:
              type: string
    Source:
      type: object
      properties:
        type:
          type: string
          example: pubmed
        id:
          type: string
          nullable: true
          example: '12345678'
        title:
          type: string
        url:
          type: string
          nullable: true
        grade:
          type: string
          nullable: true
          example: guideline
    Model:
      type: object
      properties:
        id:
          type: string
          example: Premedice/Premed-4
        object:
          type: string
          example: model
        owned_by:
          type: string
          example: premedice
    ModelList:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          enum: [Premedice/Premed-4]
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          default: 0.2
        max_tokens:
          type: integer
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        model:
          type: string
          example: Premedice/Premed-4
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
        usage:
          type: object
          additionalProperties: true
        premedice_meta:
          type: object
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
    LabEntry:
      type: object
      required: [analyte]
      properties:
        analyte:
          type: string
          example: eGFR
        value:
          oneOf:
            - type: number
            - type: string
        unit:
          type: string
          example: mL/min/1.73m2
        reference_low:
          type: number
        reference_high:
          type: number
        collected_at:
          type: string
          format: date
    LabRequest:
      type: object
      required: [labs, question]
      properties:
        labs:
          type: array
          maxItems: 80
          items:
            $ref: '#/components/schemas/LabEntry'
        question:
          type: string
        patient_context:
          type: object
          additionalProperties: true
    EvidenceRequest:
      type: object
      required: [claim]
      properties:
        claim:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
